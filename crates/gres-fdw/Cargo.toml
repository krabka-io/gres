[package]
name = "krabka-gres-fdw"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Foreign-data wrapper exposing Kafka topics as SQL tables inside Crabka Gres tenant databases"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-gres-fdw"
readme = "README.md"
keywords = ["kafka", "postgres", "fdw", "crabka", "gres"]
categories = ["database", "asynchronous"]

[lints]
workspace = true

[features]
default = []
roundtrip = []

[dependencies]
krabka-pgcatalog = { version = "0.4.2", path = "../pgcatalog" }
krabka-pgtypes = { version = "0.4.2", path = "../pgtypes" }
krabka-pgexec = { version = "0.4.2", path = "../pgexec" }
krabka-pgkv = { version = "0.4.2", path = "../pgkv" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
thiserror = { workspace = true }
krabka-client-core = { version = "0.4.2", path = "../client-core" }
krabka-client-admin = { version = "0.4.2", path = "../client-admin" }
krabka-protocol = { version = "0.4.2", path = "../protocol" }
krabka-schema-serde = { version = "0.4.2", path = "../schema-serde", features = ["avro", "json", "protobuf"] }
krabka-security = { workspace = true }
krabka-units = { workspace = true }
apache-avro = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
jiff = { workspace = true }
bigdecimal = { workspace = true }
num-bigint = { workspace = true }
prost-reflect = { workspace = true }
protox = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-broker = { version = "0.4.2", path = "../broker" }
krabka-schema-registry = { version = "0.4.2", path = "../schema-registry" }
krabka-client-producer = { version = "0.4.2", path = "../client-producer" }
krabka-pgwire = { version = "0.4.2", path = "../pgwire" }
tokio-postgres = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
