[package]
name = "krabka-gres"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Crabka Gres service: a pure-Rust Postgres-compatible tenant compute for the Crabka substrate"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-gres"
readme = "README.md"
keywords = ["postgres", "database", "serverless", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[[bin]]
name = "krabka-gres"
path = "src/main.rs"

[dependencies]
krabka-pgexec = { version = "0.4.2", path = "../pgexec" }
krabka-pgkv = { version = "0.4.2", path = "../pgkv" }
krabka-pgwire = { version = "0.4.2", path = "../pgwire" }
krabka-gres-fdw = { path = "../gres-fdw" }
krabka-gres-control = { path = "../gres-control" }
krabka-pgcatalog = { path = "../pgcatalog" }
krabka-gres-ranges = { path = "../gres-ranges" }
krabka-gres-substrate = { path = "../gres-substrate" }
krabka-object-store = { version = "1.0.0" }
krabka-client-admin = { version = "0.6.0" }
krabka-client-core = { version = "0.6.0" }
krabka-client-producer = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-security = { version = "0.6.0" }
krabka-telemetry = { version = "1.0.0" }
krabka-units = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rand = { workspace = true }
refined_type = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
async-trait = { workspace = true }

[dev-dependencies]
krabka-gres-operator = { path = "../gres-operator" }
futures-util = { workspace = true }
async-trait = { workspace = true }
assert2 = { workspace = true }
bytes = { workspace = true }
krabka-broker = { version = "1.0.0" }
krabka-gres-control = { path = "../gres-control" }
krabka-pgmvcc = { path = "../pgmvcc" }
krabka-pgtypes = { path = "../pgtypes" }
krabka-security = { version = "0.6.0" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-postgres = { workspace = true }
tracing-subscriber = { workspace = true }
