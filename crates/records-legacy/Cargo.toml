[package]
name = "krabka-records-legacy"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["The Crabka Authors"]
description = "Kafka v0/v1 MessageSet (legacy) codec and v2 RecordBatch bridge"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-records-legacy"
readme = "../../README.md"
keywords = ["kafka", "wire-protocol", "messageset", "down-conversion"]
categories = ["encoding", "parser-implementations"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["gzip", "snappy", "lz4", "zstd"]
gzip   = ["krabka-compression/gzip"]
snappy = ["krabka-compression/snappy"]
lz4    = ["krabka-compression/lz4"]
zstd   = ["krabka-compression/zstd"]

[dependencies]
assert2 = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
krabka-compression = { version = "0.4.2", path = "../compression", default-features = false }
krabka-ids = { version = "0.4.2", path = "../ids" }
krabka-protocol = { version = "0.4.2", path = "../protocol", default-features = false }
krabka-units = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hex = { workspace = true }
