[package]
name = "krabka-gres-control"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Control-plane tenant registry for Crabka Gres"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-gres-control"
readme = "README.md"
keywords = ["postgres", "control-plane", "kafka", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
krabka-client-admin = { version = "0.6.0" }
krabka-client-core = { version = "0.6.0" }
krabka-client-producer = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-units = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
static_assertions = "1"
assert2 = { workspace = true }
krabka-broker = { version = "1.0.0", features = ["test-helpers"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
