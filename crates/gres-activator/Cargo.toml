[package]
name = "krabka-gres-activator"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Scale-to-zero wake activator for Crabka Gres"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
keywords = ["postgres", "gres", "lifecycle", "crabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
krabka-client-core = { version = "0.6.0" }
krabka-gres-control = { version = "0.4.2", path = "../gres-control" }
krabka-pgwire = { version = "0.4.2", path = "../pgwire" }
krabka-units = { workspace = true }
futures-util = { workspace = true }
refined_type = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
assert2 = { workspace = true }
krabka-gres = { version = "0.4.2", path = "../gres" }
krabka-gres-substrate = { version = "0.4.2", path = "../gres-substrate" }
krabka-pgkv = { version = "0.4.2", path = "../pgkv" }
temp-env = "0.3"
