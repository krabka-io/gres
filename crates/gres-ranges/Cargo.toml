[package]
name = "krabka-gres-ranges"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed range maps and deterministic routing primitives for Crabka Gres multi-range tenants"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-gres-ranges"
readme = "README.md"
keywords = ["postgres", "ranges", "routing", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
arc-swap = { workspace = true }
krabka-gres-control = { version = "0.4.2", path = "../gres-control" }
krabka-security = { version = "0.6.0" }
krabka-pgcatalog = { version = "0.4.2", path = "../pgcatalog" }
krabka-pgexec = { version = "0.4.2", path = "../pgexec" }
krabka-pgkv = { version = "0.4.2", path = "../pgkv" }
krabka-pgmvcc = { version = "0.4.2", path = "../pgmvcc" }
krabka-pgparser = { version = "0.4.2", path = "../pgparser" }
krabka-pgtypes = { version = "0.4.2", path = "../pgtypes" }
krabka-pgwire = { version = "0.4.2", path = "../pgwire" }
# W3C trace-context propagation across the range RPC hop. Deliberately *not*
# `krabka-telemetry`, which pulls in axum, tonic and the OTLP exporter that a
# transport crate has no business linking.
krabka-trace-context = { version = "0.6.0" }
krabka-units = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "into", "from_str"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true }
refined_type = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "process", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-broker = { version = "0.7.0" }
krabka-client-admin = { version = "0.6.0" }
# Tracing assertions run against exported `SpanData`, not live `Span` handles:
# `tracing-opentelemetry` resolves a span's parent and trace id at close, so a
# live handle reports the wrong tree.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
proptest = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
