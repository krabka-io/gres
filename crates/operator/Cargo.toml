[package]
name = "krabka-operator"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Kubernetes operator for Crabka clusters"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-operator"
readme = "README.md"
keywords = ["kafka", "kubernetes", "operator", "crabka"]
categories = ["config", "network-programming"]

[[bin]]
name = "krabka-operator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["env"] }
krabka-client-admin = { version = "0.4.2", path = "../client-admin" }
krabka-client-core = { version = "0.4.2", path = "../client-core" }
krabka-client-producer = { version = "0.4.2", path = "../client-producer" }
krabka-broker = { version = "0.4.2", path = "../broker" }
krabka-compression = { version = "0.4.2", path = "../compression" }
krabka-gres-control = { version = "0.4.2", path = "../gres-control" }
krabka-gres-ranges = { version = "0.4.2", path = "../gres-ranges" }
krabka-gres-substrate = { version = "0.4.2", path = "../gres-substrate" }
krabka-kraft-core = { version = "0.4.2", path = "../kraft-core" }
krabka-logfmt = { version = "0.4.2", path = "../logfmt" }
krabka-metadata = { version = "0.4.2", path = "../metadata" }
krabka-object-store = { version = "0.4.2", path = "../object-store" }
krabka-schema-serde = { version = "0.4.2", path = "../schema-serde" }
krabka-security = { workspace = true }
krabka-units = { workspace = true }
krabka-pgkv = { version = "0.4.2", path = "../pgkv" }
krabka-pgexec = { version = "0.4.2", path = "../pgexec" }
base64 = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
futures = { workspace = true }
jsonpath-rust = { workspace = true }
ring = { workspace = true }
k8s-openapi = { workspace = true, features = ["schemars"] }
kube = { workspace = true }
prometheus-client = { workspace = true }
object_store = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
refined_type = { workspace = true }
rustls = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
hex = { workspace = true }
strum = { workspace = true }
time = { version = "0.3", default-features = false, features = ["macros", "parsing", "formatting"] }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-postgres = { workspace = true }
native-tls = { workspace = true }
postgres-native-tls = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
assert2 = { workspace = true }
# Path-only (no version): keeps this dev-dependency out of the published
# manifest so `cargo publish`/release-plz never resolve it against crates.io.
# krabka-rebalancer publishes a release behind the rest of the workspace, so a
# version pin here aborts the whole release run (see #455). Do not let
# `cargo set-version` re-add a version — dev-deps need none.
krabka-rebalancer = { path = "../rebalancer" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
tempfile = { workspace = true }
