[package]
name = "krabka-gres-conformance"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Differential conformance harness diffing Crabka Gres against a real PostgreSQL oracle over the wire"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-gres-conformance"
readme = "README.md"
keywords = ["postgres", "conformance", "testing", "crabka", "gres"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[[bin]]
name = "krabka-gres-record"
path = "src/bin/record.rs"

[[bin]]
name = "krabka-gres-parser-commands"
path = "src/bin/parser_commands.rs"

[[bin]]
name = "krabka-gres-driver-smoke"
path = "src/bin/driver_smoke.rs"

[[bin]]
name = "krabka-gres-driver-golden-replay"
path = "src/bin/driver_golden_replay.rs"

[dependencies]
krabka-units = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-postgres = { workspace = true }
native-tls = { workspace = true }
postgres-native-tls = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
krabka-pgparser = { version = "0.4.2", path = "../pgparser" }

[dev-dependencies]
assert2 = { workspace = true }
tempfile = { workspace = true }
krabka-pgexec = { version = "0.4.2", path = "../pgexec" }
krabka-pgwire = { version = "0.4.2", path = "../pgwire" }
krabka-pgcatalog = { version = "0.4.2", path = "../pgcatalog" }
krabka-pgtypes = { version = "0.4.2", path = "../pgtypes" }
