fjall = { workspace = true }
zerocopy = { workspace = true }
krabka-units = { workspace = true }
refined_type = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
jiff = { workspace = true }
