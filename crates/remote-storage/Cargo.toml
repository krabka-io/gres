[package]
name = "krabka-remote-storage"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "KIP-405 tiered-storage SPI (RemoteStorageManager / RemoteLogMetadataManager) and reference implementations for Crabka"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-remote-storage"
readme = "README.md"
keywords = ["kafka", "tiered-storage", "object-store", "crabka"]
categories = ["database-implementations", "filesystem"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
krabka-ids = { version = "0.4.2", path = "../ids" }
krabka-object-store = { version = "0.4.2", path = "../object-store" }
krabka-units = { workspace = true }
object_store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-log = { version = "0.4.2", path = "../log" }
krabka-protocol = { version = "0.4.2", path = "../protocol", default-features = false }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
