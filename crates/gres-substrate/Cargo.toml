[package]
name = "krabka-gres-substrate"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Substrate-backed durability for Crabka Gres tenant computes: WAL journaling to a per-tenant topic, fencing, and replay"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-gres-substrate"
readme = "README.md"
keywords = ["postgres", "wal", "durability", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
# Compile-time-only deterministic crash hooks. This is deliberately absent from
# default builds and exists solely for the production-service crash matrix.
checkpoint-test-hooks = []

[[test]]
name = "checkpoint_crashes"
required-features = ["checkpoint-test-hooks"]

[dependencies]
krabka-pgexec = { version = "0.4.2", path = "../pgexec" }
krabka-pgkv = { version = "0.4.2", path = "../pgkv" }
krabka-pgmvcc = { version = "0.4.2", path = "../pgmvcc" }
krabka-client-core = { version = "0.6.0" }
krabka-client-producer = { version = "0.6.0" }
krabka-client-admin = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0" }
krabka-security = { workspace = true }
krabka-gres-ranges = { version = "0.4.2", path = "../gres-ranges" }
krabka-object-store = { version = "1.0.0" }
# W3C trace-context propagation only. Deliberately *not* `krabka-telemetry`,
# which drags in axum/clap/pprof/tonic/opentelemetry-otlp.
krabka-trace-context = { version = "0.6.0" }
krabka-units = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
krabka-pgcatalog = { version = "0.4.2", path = "../pgcatalog" }
assert2 = { workspace = true }
proptest = { workspace = true }
krabka-broker = { version = "1.0.0", features = ["test-helpers"] }
krabka-raft = { version = "1.0.0" }
krabka-pgtypes = { version = "0.4.2", path = "../pgtypes" }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
stateright = { workspace = true }
tracing-opentelemetry = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rustix = { workspace = true, features = ["process"] }
