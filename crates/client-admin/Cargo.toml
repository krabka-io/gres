[package]
name = "krabka-client-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Operator-side admin client for Crabka clusters"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-client-admin"
readme = "README.md"
keywords = ["kafka", "admin", "client", "crabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[dependencies]
assert2            = { workspace = true }
krabka-units = { workspace = true }
krabka-client-core = { version = "0.4.2", path = "../client-core" }
krabka-ids         = { version = "0.4.2", path = "../ids" }
krabka-metadata    = { version = "0.4.2", path = "../metadata" }
krabka-protocol    = { version = "0.4.2", path = "../protocol", default-features = false }
krabka-security    = { version = "0.4.2", path = "../security" }
async-trait        = { workspace = true }
bytes              = { workspace = true }
ring               = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["sync", "time", "net"] }
tracing            = { workspace = true }
uuid               = { workspace = true }

[dev-dependencies]
krabka-broker      = { path = "../broker" }
krabka-client-consumer = { path = "../client-consumer" }
krabka-client-core = { path = "../client-core", features = ["mock"] }
krabka-client-producer = { path = "../client-producer" }
futures-util       = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util         = { workspace = true, features = ["codec"] }
tracing-subscriber = { workspace = true }
