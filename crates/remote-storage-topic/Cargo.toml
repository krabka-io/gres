[package]
name = "krabka-remote-storage-topic"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Topic-backed RemoteLogMetadataManager for Crabka tiered storage"
repository = "https://github.com/krabka-io/gres"
homepage = "https://github.com/krabka-io/gres"
documentation = "https://docs.rs/krabka-remote-storage-topic"
readme = "README.md"
keywords = ["kafka", "tiered-storage", "metadata", "crabka"]
categories = ["database-implementations", "encoding"]

[lints]
workspace = true

[dependencies]
krabka-remote-storage = { version = "0.4.2", path = "../remote-storage" }
krabka-client-admin = { version = "0.4.2", path = "../client-admin" }
krabka-client-core = { version = "0.4.2", path = "../client-core" }
krabka-client-producer = { version = "0.4.2", path = "../client-producer" }
krabka-protocol = { version = "0.4.2", path = "../protocol" }
krabka-ids = { version = "0.4.2", path = "../ids" }
krabka-units = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
refined_type = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
assert2 = { workspace = true }
krabka-security = { version = "0.4.2", path = "../security" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
