[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
publish = true
publish_no_verify = true
release = true
changelog_config = "release-plz-changelog.toml"
git_release_type = "auto"
semver_check = false
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]

