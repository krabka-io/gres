name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CORE_PACKAGES: >-
    -p crabka-units -p crabka-trace-context -p crabka-pgtypes
    -p crabka-pgparser -p crabka-pgwire -p crabka-pgkv -p crabka-pgmvcc
    -p crabka-pgcatalog -p crabka-pgexec -p crabka-gres-conformance
  CORE_TARGETS: >-
    //crates/units/... //crates/trace-context/... //crates/pgtypes/...
    //crates/pgparser/... //crates/pgwire/... //crates/pgkv/...
    //crates/pgmvcc/... //crates/pgcatalog/... //crates/pgexec/...
    //crates/gres-conformance/...

jobs:
  verify:
    name: format · lint · Bazel test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-14
          components: rustfmt
      - name: format
        run: cargo +nightly fmt --all -- --check
      - name: lint
        run: cargo clippy $CORE_PACKAGES --all-targets
      - name: test
        run: bazel test $CORE_TARGETS
      - name: install cargo-nextest
        run: |
          curl -LsSf --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/cargo-nextest.tar.gz" \
            https://get.nexte.st/latest/linux
          tar zxf "${RUNNER_TEMP}/cargo-nextest.tar.gz" \
            -C "${CARGO_HOME:-${HOME}/.cargo}/bin"
      - name: process-isolated telemetry tests
        run: cargo nextest run -p crabka-pgexec --test telemetry --test telemetry_exec

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - run: bazel coverage $CORE_TARGETS
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          fail_ci_if_error: true

  gate:
    name: gate
    if: always()
    needs: [verify, coverage]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success"
