# cargo-mutants configuration — https://mutants.rs
#
# Checked in so `cargo mutants` runs out of the box (locally and in CI) with the
# same runner and exclusions the project uses everywhere else.

# Crabka tests run under nextest in every other job (CI, .config/nextest.toml),
# so point cargo-mutants at the same runner. nextest fails fast by default,
# which is exactly what we want when killing mutants. NEXTEST_PROFILE=ci (set in
# the CI workflow) then picks up the test-group serialization in
# .config/nextest.toml so the fixed-port broker/schema-registry binaries don't
# race for ports inside a single mutant's test run.
test_tool = "nextest"
profile = "mutants"

# A surviving mutant deep in the broker / log / raft paths is often only caught
# by the (slower) in-process integration suites under each crate's tests/ dir.
# Give every mutant run a generous timeout relative to the unmutated baseline so
# a legitimately-slower-but-correct run isn't misreported as a "timeout"
# survivor, with a high floor for those heavier suites.
timeout_multiplier = 5.0
minimum_test_timeout = 120

# Don't generate mutants in files that carry no unit-testable signal. The first
# entries mirror the codecov `ignore` list in codecov.yml: machine-emitted protocol
# codecs (encode/decode/populate per record type) and pure entrypoint/serve-loop
# glue. The last entries keep mutation focused on the system under test rather
# than the test/bench harnesses themselves.
exclude_globs = [
    # `krabka-broker`'s `main` is pure entrypoint glue: parse CLI args, derive the
    # controller listener + self single-voter set, build `BrokerConfig`, hand it to
    # `Broker::start`, then wait for a termination signal and controlled-shutdown.
    # No unit-testable signal (no test constructs the live broker from CLI args);
    # it is exercised end-to-end by `tests/cli_smoke.rs` (boots the real binary)
    # and every in-process broker/integration test. Same rationale as the
    # schema-registry `src/bin/**` glob above. NB: a file glob is
    # used rather than an `exclude_re` on the mutant name because name-regex
    # exclusions do not reliably match struct-field-deletion mutants here.
    # krabka-audit's `verify` CLI: clap arg-parse + VerifyReport→ExitCode glue.
    # The verification logic lives in verify.rs and IS mutation-tested. Same
    # rationale as the schema-registry / broker `src/bin/**` globs.
    # KIP-939 idle-transaction reaper background task: a `tokio::interval` run
    # loop + `current_image`/leader-refresh orchestration. Pure serve-loop glue
    # (same rationale as `operator/src/run.rs`); its decision core lives in
    # `txn/two_pc.rs` and is mutation-tested + model-checked there.
    "crates/*/tests/**",
    # In-source unit-test modules and test-only helpers are part of the test
    # harness, not the production system under test. Large refactors that split
    # `src/foo.rs` into `src/foo/tests.rs` otherwise make cargo-mutants spend CI
    # time mutating assertions/fixtures and report survivors that do not reflect
    # production-code coverage.
    "crates/*/src/**/tests.rs",
    "crates/*/src/**/test_*.rs",
    "crates/*/benches/**",
    # The gres load/chaos harness drives real broker + krabka-gres child
    # processes behind chaos proxies end-to-end. It is a test/bench harness, not
    # the system under test. Most of its
    # surface (cluster orchestration, fault execution, process sampling) is only
    # reachable with built binaries via its `#[ignore]`d live test, which
    # mutant runs cannot execute.
    "crates/gres-loadtest/**",
]

# Skip mutants whose display name matches these regexes. Used for spurious
# mutants in code that the default feature set compiles out: cargo-mutants
# mutates from the source AST without evaluating `#[cfg(...)]`, so a function
# under `#[cfg(not(feature = ...))]` gets mutated even though the active build
# never compiles it — the mutation is a no-op that always "survives".
exclude_re = [
    # Removing the client-metrics shutdown call leaves the live OTLP worker
    # waiting forever. The drain test detects that, but cargo-mutants can only
    # classify the deliberately stuck process as a timeout.
    "broker/src/client_metrics/mod\\.rs.*replace ClientMetrics::shutdown with \\(\\)",
    # `BatchedTsoClient` flusher-liveness mutants: never spawning a flusher
    # (`delete !` flips the single-flusher test-and-set) or spawning a no-op one
    # makes every timestamp grant await a reply that can never arrive. The
    # dedicated unit tests bound their grants and fail within seconds — the
    # mutants ARE detected — but the tenant-level integration suites in the same
    # package (jepsen, cross-range 2PC) issue grants through unbounded SQL
    # paths and hang the remainder of the run past any mutant budget, so the
    # outcome is always recorded as a timeout rather than a kill. Excluded as
    # detected-but-unreportable; the flusher's drain loop, clean-exit flag
    # handshake, reset guard, and error fan-out all remain mutation-tested.
    "gres-ranges/src/tso/client\\.rs.*delete ! in BatchedTsoClient<R>::grant",
    "gres-ranges/src/tso/client\\.rs.*replace BatchedTsoClient<R>::spawn_flush with \\(\\)",
    # ListPartitionReassignments `removing_replicas` echo: only populated for a
    # partition with an *in-flight* removal, which the controller cannot hold from a
    # directly-seeded `PartitionRecord` — apply auto-completes the removal (verified:
    # seeding replicas=[1,2,3] + removing=[3] applies as replicas=[1,2] + removing=[]).
    # A genuine pending removal exists only mid-flight in the live
    # AlterPartitionReassignments state machine (integration suite). The sibling
    # `adding_replicas` field is pinned by `filtered_success_response_...`.
    # krabka-compression's feature-disabled codec stubs (`#[cfg(not(feature =
    # "gzip"))] fn gzip_compress -> Err(FeatureDisabled(..))`, etc.). They are
    # only reachable — and only killable — with the codec feature turned off.
    # The public `compress`/`decompress` dispatchers have no codec prefix, so
    # they are not matched and stay under test.
    "compression/src/lib\\.rs.* replace (gzip|snappy|lz4|zstd)_(compress|decompress) ->",
    # krabka-kraft-core's `sim` module is `#[cfg(feature = "sim")]` and that
    # feature is OFF in the crate's default build. cargo-mutants tests a mutant
    # in krabka-kraft-core against the crate's own default features, so the whole
    # module is compiled out and every mutation in it is a no-op that always
    # "survives" — the same default-feature-compiles-it-out case as the
    # compression stubs above. The simulator's logic IS exercised: its unit tests
    # run in the feature-enabled workspace test job (codecov covers the lines).
    "kraft-core/src/sim\\.rs",
    # krabka-security's SSPI provider is behind the optional `sspi-keytab`
    # feature and is compiled out in the crate's default package run, so default
    # cargo-mutants sees no behavioural difference. The provider's real contract
    # test requires a live MIT KDC fixture and is intentionally ignored unless
    # that fixture is running.
    "security/src/gssapi/provider\\.rs",
    # Equivalent mutant: Reader::at_end returning false at exact EOF still falls
    # into the next size-read's Truncated => break EOF path. (Jwks::empty ==
    # Default::default() is now skipped in-source via `#[mutants::skip]`.)
    "security/src/gssapi/keytab\\.rs.*replace Reader<'a>::at_end -> bool with false",
    # Mutating keytab entry-size reads to zero makes the parser loop on an
    # endless stream of zero-length records, so cargo-mutants can only classify
    # it as a timeout rather than a useful assertion gap.
    "security/src/gssapi/keytab\\.rs.*replace Reader<'a>::i32 -> Result<i32, KeytabError> with Ok\\(0\\)",
    # client-producer builder: `init_producer_id` is the live Client RPC retry
    # loop; its request shape, retry classifier, deadline, and backoff boundaries
    # are tested in pure helpers, while observing the match guard requires a
    # broker/client. (`build_init_producer_id_request` — the protocol-default
    # InitProducerId shape for idempotent-only producers, so `-> Default` is
    # equivalent — is now skipped in-source via `#[cfg_attr(test, mutants::skip)]`.)
    # krabka-metadata feature-registry equivalent mutants: today, the default
    # min floor for non-metadata.version features is genuinely 0, plain features
    # declare no dependencies, and share/streams default to 0 and support (0, 1).
    # (`validate_feature_dependencies` — a no-op for the real dependency-free
    # registry — is now skipped in-source via `#[mutants::skip]`; synthetic
    # dependency behavior is unit-tested via check_deps.)
    "metadata/src/feature\\.rs.*replace Feature::min_required_floor -> i16 with 0",
    "metadata/src/feature\\.rs.*replace Feature::dependencies -> &'static\\[\\(&'static str, i16\\)\\] with Vec::leak\\(Vec::new\\(\\)\\)",
    "metadata/src/feature\\.rs.*replace <impl Feature for (GroupVersionFeature|ShareVersionFeature|StreamsVersionFeature)>::supported_range -> \\(i16, i16\\) with \\(0, 1\\)",
    "metadata/src/feature\\.rs.*replace <impl Feature for (ShareVersionFeature|StreamsVersionFeature)>::default_level -> i16 with 0",
    # Metadata image dir-assignment: resizing an already-full directories vec to
    # the same length is a Vec no-op, so `<` -> `<=` is equivalent.
    # KRaft translation default-field equivalents: ConfigRecord.value defaults
    # to None for tombstones; the synthetic broker endpoint's name defaults to
    # empty string and security_protocol defaults to PLAINTEXT.
    # krabka-schema-serde's format modules are gated behind optional features
    # (`avro`, `json`, `protobuf`) and the crate's default feature set enables
    # none of them. cargo-mutants' default package run mutates these source
    # files even though they are compiled out, so those mutations are no-op
    # survivors under the default build. Feature-enabled test jobs exercise the
    # modules themselves.
    "schema-serde/src/format/(avro|json|protobuf)\\.rs",
    "schema-serde/src/format/mod\\.rs.*Binding::register",

    # `live_committed_end` is a live-broker seam adapter: it constructs a
    # `LiveCommittedEndSampler` over the real broker dialer and delegates. The
    # sampler's committed-end logic is unit-tested against a counting fake
    # dialer (follower.rs); only the live-broker construction — which returns
    # a real committed offset the tests below cannot pin without a broker —
    # remains, so the `Ok(-1|0|1)` mutants are covered only by broker
    # integration tests. Same rationale as the client-producer live adapter
    # above.
    "(crates/)?gres-substrate/src/recovery\\.rs.*replace live_committed_end",
    # Live broker/client SCRAM wire-shape fields are integration-level signal; the
    # branch's new admin UI unit tests cover the DTO/seam behaviour without a
    # running broker.
    "broker/src/handlers/(alter_user_scram_credentials|describe_user_scram_credentials)\\.rs.*delete field (throttle_time_ms|error_message|credential_infos)",
    "client-admin/src/users\\.rs.*(describe_user_scram_credentials|delete field (users|name))",
    # (client-core's `FetchTransport`/pool/`Client`/`Connection` live-IO seams
    # are skipped in-source via `#[cfg_attr(test, mutants::skip)]`: the adapter
    # `<impl FetchTransport for Connection>::fetch`, the thin `fetch_partition`
    # wrappers, `BrokerPool::close_all` (equivalent: consume-self drop), and the
    # `Client`/`Connection` facade/wire helpers — all need a live broker socket
    # and are exercised by the `mock`-feature tests in `tests/unit.rs`. Their
    # socket-free cores (`fetch_partition_on`, pool eviction/bootstrap) stay
    # mutation-tested.)
    # MockBroker is itself the feature-gated test harness used by the client-core
    # unit target; mutating its stop/connection loop has no signal in the
    # default-feature package run, which does not build that test target.
    # The GSSAPI outbound client is behind the optional `sspi-keytab` feature.
    # The default client-core package run compiles the feature-disabled stub, so
    # cargo-mutants cannot observe the feature-enabled Kerberos state machine.
    # The provider contract is covered by the feature/KDC fixture path.
    # `put_uvarint` mutants: changing the loop predicate's bit test can create
    # non-terminating encoders for multi-byte values, and OR vs XOR is
    # equivalent because `(v & 0x7F)` never overlaps the continuation bit 0x80.
    # An infinite-loop mutant that HANGS rather than yields a wrong result, so
    # cargo-mutants reports a TIMEOUT, not an assertion gap:
    # - `Consumer::poll -> Ok(vec![])`: an always-empty poll makes every
    #   poll-until-data loop spin
    #   forever — no assertion can observe a hang. The real poll's fetch/decode/
    #   seek/commit logic is unit- and integration-tested.
    "client-consumer/src/poll\\.rs.*replace Consumer::poll .* with Ok\\(vec!\\[\\]\\)",
    # poll.rs live async wrappers and malformed fetch/list-offset requests can
    # only be observed through broker-backed polling. Their request construction
    # and pure routing/offset math helpers are mutation-tested in poll.rs.
    # (client-consumer `Consumer::commit_sync` / `commit_async` are live
    # coordinator RPC wrappers, skipped in-source via `#[cfg_attr(test,
    # mutants::skip)]`; their socket-free request/snapshot/error-mapping helpers
    # in commit.rs stay mutation-tested.)
    # client-consumer coordinator edge cases:
    # - `find_coordinator` is the live Client RPC/metadata-refresh wrapper; its
    #   request construction and response projection are mutation-tested in pure
    #   helpers, but canned return-value mutants need a broker coordinator to
    #   observe.
    # - forcing retry deadline/backoff helpers to "never elapsed" or zero
    #   backoff creates non-terminating retry loops, reported as TIMEOUT rather
    #   than a useful assertion gap; the helpers' boundaries are unit-tested.
    # In `classify`, changing the safe-offset clamp from `< 0` to `<= 0` is
    # equivalent: for `leader_end_offset == 0`, both branches return `0`.
    # (client-consumer `Consumer::refresh_leader_epochs` / `validate_positions`
    # — live metadata/leader-epoch RPC wrappers — and the share coordinator's
    # background heartbeat `run` serve-loop are skipped in-source via
    # `#[cfg_attr(test, mutants::skip)]`; their socket-free decision helpers in
    # validate.rs / share helpers stay mutation-tested.)
    # Share poll/ack live entrypoints send protocol requests over a Client. The
    # request builders, error predicates, topic-id resolution, range math, and
    # ack grouping are mutation-tested in socket-free helpers in share/poll.rs;
    # these wrappers need a broker-side share fetch/ack endpoint to observe.
    # (The manual `Debug` impls — `FileEd25519Signer` (keeps key material out of
    # logs) and `KafkaTopicAuditSink` (only because BrokerMetrics isn't Debug) —
    # and the `now_ms` wall-clock helper are skipped in-source via
    # `#[cfg_attr(test, mutants::skip)]`: no behavioural signal.)
    # interval_at start instant: shifting it only moves the first replay/checkpoint
    # tick by one period — no signal a deterministic test can assert.
    "audit/src/log\\.rs.*replace \\+ with - in AuditWriter::run",
    # Equivalent: when valid_bytes == physical (no torn tail) the `<` guard skips
    # set_len; `<=` would set_len to the same length — a no-op truncation.
    "audit/src/spool\\.rs.*replace < with <= in Spool::open",
    # Defensive bounds on truncated/adversarial spool input; the "stop on a
    # truncated/corrupt frame without panicking" contract is verified by
    # open_heals_torn_tail_frame and the read_all length guard.
    "audit/src/spool\\.rs.*replace take_u32 ->",
    "audit/src/spool\\.rs.*in take_u32",
    # Recovery tail-window floor: identical result for any partition whose tail
    # fits the 4096-offset window (leo-4096 and leo+4096 both clamp to 0 for the
    # realistic small audit partition); only differs for >4096-record tails.
    "broker/src/audit_recovery\\.rs.*replace - with \\+ in recover_from_partition_tail",
    # AlterPartition response builders intentionally pin several Kafka protocol
    # default-zero fields (`NONE`, no leader recovery, no throttle, and no
    # partition epoch on errors). A struct-field-deletion mutant falls back to
    # the same generated protocol default, so there is no behavioral signal.
    "broker/src/handlers/alter_partition\\.rs.*delete field error_code from struct RespPartitionData expression in handle_partition",
    "broker/src/handlers/alter_partition\\.rs.*delete field leader_recovery_state from struct RespPartitionData expression in handle_partition",
    "broker/src/handlers/alter_partition\\.rs.*delete field leader_recovery_state from struct RespPartitionData expression in error_part",
    "broker/src/handlers/alter_partition\\.rs.*delete field partition_epoch from struct RespPartitionData expression in error_part",
    "broker/src/handlers/alter_partition\\.rs.*delete field throttle_time_ms from struct AlterPartitionResponse expression in denied_response",
    # Same default-value class for admin response wrappers: these fields are
    # explicitly set to Kafka protocol defaults, so deleting them produces the
    # same generated owned response value. Non-default identity/error fields in
    # these handlers stay covered by focused tests.
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field throttle_time_ms from struct AlterPartitionReassignmentsResponse expression in handle",
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field error_code from struct AlterPartitionReassignmentsResponse expression in handle",
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field error_message from struct AlterPartitionReassignmentsResponse expression in handle",
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field error_code from struct ReassignablePartitionResponse expression in ok_row",
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field error_message from struct ReassignablePartitionResponse expression in ok_row",
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field error_code from struct AlterPartitionReassignmentsResponse expression in encode_whole_request_error",
    "broker/src/handlers/alter_partition_reassignments\\.rs.*delete field error_message from struct AlterPartitionReassignmentsResponse expression in encode_whole_request_error",
    "broker/src/handlers/alter_replica_log_dirs\\.rs.*delete field throttle_time_ms from struct AlterReplicaLogDirsResponse expression in handle",
    "broker/src/handlers/alter_user_scram_credentials\\.rs.*delete field throttle_time_ms from struct AlterUserScramCredentialsResponse expression in handle",
    "broker/src/handlers/alter_user_scram_credentials\\.rs.*delete field error_code from struct AlterUserScramCredentialsResult expression in ok_result",
    "broker/src/handlers/alter_user_scram_credentials\\.rs.*delete field error_message from struct AlterUserScramCredentialsResult expression in ok_result",
    "broker/src/handlers/api_versions\\.rs:126:.*delete field api_keys from struct ApiVersionsResponse expression in handle",
    "broker/src/handlers/api_versions\\.rs:127:.*delete field throttle_time_ms from struct ApiVersionsResponse expression in handle",
    "broker/src/handlers/api_versions\\.rs:142:.*delete field error_code from struct ApiVersionsResponse expression in handle",
    "broker/src/handlers/api_versions\\.rs:144:.*delete field throttle_time_ms from struct ApiVersionsResponse expression in handle",
    "broker/src/handlers/assign_replicas_to_dirs\\.rs.*delete field error_code from struct AssignReplicasToDirsResponse expression in handle",
    "broker/src/handlers/assign_replicas_to_dirs\\.rs.*delete field error_code from struct RespPartData expression in build_echo_response",
    "broker/src/handlers/assign_replicas_to_dirs\\.rs.*delete field error_code from struct AssignReplicasToDirsResponse expression in build_echo_response",
    "broker/src/handlers/broker_heartbeat\\.rs.*delete field throttle_time_ms from struct BrokerHeartbeatResponse expression in (handle|not_controller_response|success_response|denied_response_body)",
    "broker/src/handlers/broker_heartbeat\\.rs.*delete field is_caught_up from struct BrokerHeartbeatResponse expression in (handle|not_controller_response|denied_response_body)",
    "broker/src/handlers/broker_heartbeat\\.rs.*delete field should_shut_down from struct BrokerHeartbeatResponse expression in (handle|not_controller_response|denied_response_body)",
    "broker/src/handlers/broker_heartbeat\\.rs.*delete field error_code from struct BrokerHeartbeatResponse expression in (handle|success_response)",
    "broker/src/handlers/broker_heartbeat\\.rs.*delete field is_fenced from struct BrokerHeartbeatResponse expression in (handle|success_response)",
    # Equivalent throttle guard mutant: `delay >= Duration::ZERO` differs only
    # by awaiting `sleep(Duration::ZERO)` on the no-throttle path. Non-zero
    # throttle branches are asserted by focused handler tests.
    "broker/src/handlers/create_partitions\\.rs.*replace > with >= in handle",
    "broker/src/handlers/create_topics\\.rs.*replace > with >= in handle",
    "broker/src/handlers/consumer_group_describe\\.rs.*delete field error_code from struct DescribedGroup expression in (handle|ok_row)",
    # The offset is the human-facing VerifyBreak.offset diagnostic (standard Kafka
    # base_offset + offset_delta), not the tamper verdict.
    "audit/src/verify\\.rs.*replace \\+ with (-|\\*) in verify_partition_dir",
    # `scan_from_floor_windowed` computes `last_read` (the last offset in the
    # window just read) as `last.base_offset + last.last_offset_delta`, then sets
    # `cursor = last_read + 1` to advance. Mutating this `+` makes `last_read`
    # regress below `cursor`, so the cursor never advances and the windowed scan
    # loops forever — cargo-mutants reports a TIMEOUT rather than an assertion
    # gap. (Line-anchored so the sibling `+` on line 437 — the *returned* match
    # offset — stays mutation-tested; it is killed by
    # `scan_returns_absolute_offset_of_matching_record`.)
    "log/src/segment\\.rs:445:.*replace \\+ with (-|\\*) in Segment::scan_from_floor_windowed",
    # `Segment::read`'s `batch_last = base_offset + last_offset_delta` gates which
    # batches pass the `batch_last >= offset` include filter. The `+ with *`
    # mutation zeroes `batch_last` for single-record batches (`base * 0`), so the
    # batch covering `offset` is dropped and `read` returns empty; the windowed
    # scan caller then grows its window and retries the same cursor forever —
    # cargo-mutants reports a TIMEOUT, not an assertion gap. (`+ with -` on the
    # same line IS caught, so this excludes only the `*` variant.)
    "log/src/segment\\.rs.*replace \\+ with \\* in Segment::read$",
    # Creusot-only proof/spec helpers are behind `#[cfg(creusot)]` and are not
    # compiled by cargo-mutants' default `cargo nextest` package runs. Mutating
    # them is therefore a no-op for mutation testing; `creusot-verify` replays the
    # checked-in proof sessions instead. The executable kernels in these files
    # remain mutation-tested below, except for separately listed infinite-loop
    # mutants.
    # These Creusot-friendly loops intentionally use manual index counters. The
    # listed mutations break loop progress and hang the test process, so
    # cargo-mutants can only classify them as TIMEOUT rather than a useful
    # assertion gap. Vote-count increments in candidate_has_majority stay
    # mutation-tested by the focused HWM behavior tests below.
    # Equivalent under recompute_high_watermark's public preconditions: every
    # candidate is either `log_end` or a follower offset `<= log_end`, so the
    # leader-count `log_end >= cand` half is always true. The `count < majority`
    # guards only cap work once the boolean result is already true.
    # Equivalent mutant: accepting a candidate equal to the current
    # majority_offset only writes the same offset back. The epoch-start gate on
    # line 300 remains mutation-tested.
    # `run_produce_append_batch` dispatches the blocking group append by runtime
    # flavor: the `MultiThread` arm uses `block_in_place`, the `_` fallback uses
    # `spawn_blocking`. They differ only in scheduling — same append result, same
    # panic→storage-failure mapping — so deleting the `MultiThread` arm falls
    # through to a behaviourally equivalent path: a performance optimization
    # (covered by the produce benches) with no signal a correctness test can
    # assert. (The `run_produce_append` prefix also matches the `_batch` suffix.)
    "broker/src/partition_writer\\.rs.*delete match arm RuntimeFlavor::MultiThread in run_produce_append",
    # The group-commit batch-drain caps one append batch at MAX_PRODUCE_GROUP
    # jobs (`jobs.len() < MAX_PRODUCE_GROUP`). The cap is a memory/latency bound,
    # not a correctness boundary: `<` vs `<=` changes the max batch size by one
    # (1024 vs 1025) but both drain every queued job across loop iterations with
    # identical acks / offsets / HW, so the boundary has no signal a correctness
    # test can assert — the same equivalent-mutant category as the metadata image
    # `< -> <=` exclusion above. The non-equivalent `< -> ==` / `< -> >`
    # mutations on the same line are still generated and caught.
    "broker/src/partition_writer\\.rs.*replace < with <= in run$",
    # Non-terminating mutants: each stops a cursor advancing, so the mutated
    # program loops forever rather than answering wrongly. All are `+= -> *=`,
    # `+= -> -=` or `-= -> /=` on a loop counter, or a scan helper stubbed to a
    # fixed position that its caller then rescans from.
    #
    # The suite *does* detect them — the hang is the detection — but the outcome
    # is recorded as a timeout rather than a kill, the same
    # detected-but-unreportable shape as the `BatchedTsoClient` flusher entries
    # above. No assertion can be written for a state the correct code cannot
    # reach: forward progress in each of these loops is structural.
    #
    # Pinned to `line:col` deliberately. The same operator appears elsewhere in
    # these functions on paths that DO terminate — `depth += 1` in
    # `block_comment_end`, for one, which mis-nests rather than hangs and is
    # caught by the nested-comment case — so a description-only pattern would
    # silently exclude ten catchable mutants along with these. If a future edit
    # shifts a line the pattern simply stops matching and the mutant returns,
    # which is the safe direction.
    #
    # Only termination is excluded. Every *decision* these scanners make — which
    # regions are comments, where a value ends, whether a quote is escaped, where
    # a UTF-8 boundary falls — remains mutation-tested and caught.
    "gres-ranges/src/telemetry\\.rs:170:13: replace -= with /= in truncate",
    "gres-substrate/src/telemetry\\.rs:172:13: replace -= with /= in truncate_on_char_boundary",
    "trace-context/src/sqlcommenter\\.rs:116:25: replace \\+ with \\* in find_field",
    "trace-context/src/sqlcommenter\\.rs:148:13: replace \\+= with \\*= in read_value",
    "trace-context/src/sqlcommenter\\.rs:155:15: replace \\+= with \\*= in skip_spaces",
    "trace-context/src/sqlcommenter\\.rs:172:5: replace skip_quoted -> Option<usize> with Some\\(0\\)",
