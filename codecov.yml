codecov:
  notify:
    # Wait for all nineteen coverage uploads before posting status checks or PR
    # comments. Most flags upload once; workspace-integration uploads three
    # reports — one from each of the two `workspace-integration-coverage` shards
    # plus one from `observability-differential`, which owns the Docker-gated
    # Loki/Grafana suites but keeps their lines under the same flag. Otherwise
    # the first upload triggers a report against the partial coverage, which
    # shows a misleading drop until the rest of the matrix lands. This count and
    # the flags below must match the `flags:` values in
    # .github/workflows/ci.yml — adding or removing an upload without updating
    # it makes codecov wait for a report that never arrives.
    after_n_builds: 19
    wait_for_ci: true

comment:
  after_n_builds: 19
  require_changes: false

coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        only_pulls: true
        # Patch (changed-line) coverage is ADVISORY, not a gate. It is not a
        # required check, and large feature branches legitimately add
        # integration-tested-not-unit-tested code (OTLP exporter wiring, K8s
        # reconcile IO, serve loops) whose patch % dips without indicating a
        # real gap. `informational: true` keeps the coverage delta visible in
        # the PR comment but never fails the check; the `project` gate above
        # still guards overall repo coverage.
        informational: true

flags:
  unit:
    carryforward: true
  jvm-differential:
    carryforward: true
  client-core-integration:
    carryforward: true
  client-consumer-integration:
    carryforward: true
  log-integration:
    carryforward: true
  broker-jvm-acceptance:
    carryforward: true
  broker-integration:
    carryforward: true
  client-streams-integration:
    carryforward: true
  schema-serde:
    carryforward: true
  grpc-gateway-integration:
    carryforward: true
  schema-registry-integration:
    carryforward: true
  operator-integration:
    carryforward: true
  gres-integration:
    carryforward: true
  gres-conformance:
    carryforward: true
  workspace-integration:
    carryforward: true
  admin-ui-integration:
    carryforward: true
  traces-conformance:
    carryforward: true
